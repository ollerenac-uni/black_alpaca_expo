# Linux host only (needs real USB passthrough).
# Plug the SDR BEFORE 'up' (device is mapped at start, no hotplug).
# Build:  docker compose -f docker/docker-compose.yml build
# Run:    docker compose -f docker/docker-compose.yml up
# Then open http://localhost/imsi/  (enable IMSI) and http://localhost/analytics/
services:
  gsmevil2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: black-alpaca-expo
    # Least privilege instead of privileged:true.
    # SYS_RAWIO: raw USB (libusb) for the SDR. NET_RAW: tshark/dumpcap on lo.
    # NET_ADMIN: interface setup for the capture.
    cap_add:
      - SYS_RAWIO
      - NET_RAW
      - NET_ADMIN
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - "127.0.0.1:80:80"       # web only on the host loopback, not the LAN
    environment:
      SDR_FREQ: "879.8M"        # strong local BCCH; change per your scan
      SDR_GAIN: "40"
      SDR_SR: "1e6"
      SDR_ARGS: "rtl=0"         # RTL-SDR. B210: "type=b200". autodetect: ""
    restart: "no"
    # If the SDR is still not detected with the caps above, as a last resort
    # replace the cap_add/devices block with:  privileged: true
